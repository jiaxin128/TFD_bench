name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip check
      - name: Compile source
        run: python -m compileall -q run.py methods src analysis tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate method entry points
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          files = sorted(pathlib.Path("methods").glob("*.py"))
          files = [path for path in files if path.name != "__init__.py"]
          for path in files:
              subprocess.run([sys.executable, str(path), "--help"], check=True)
          print(f"Validated {len(files)} method entry points")
          PY
      - name: Validate benchmark matrix
        run: python run.py --config configs/default.yaml --dry-run
      - name: Check whitespace
        run: git diff --check