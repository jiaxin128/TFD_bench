[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfd-bench"
version = "0.1.0"
description = "Fault-diagnosis uncertainty benchmark runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.12.1",
    "torchvision==0.27.1",
    "lightning==2.6.5",
    "torchmetrics==1.9.0",
    "timm==1.0.27",
    "einops==0.8.2",
    "numpy==1.26.4",
    "pandas==2.3.3",
    "scipy==1.15.3",
    "PyYAML==6.0.3",
    "rich==15.0.0",
    "scikit-learn==1.7.2",
    "matplotlib==3.10.9",
    "laplace-torch==0.2.2.2",
    "curvlinops-for-pytorch==2.0.1",
    "mamba-ssm==2.3.2.post1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
